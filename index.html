<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<title>Training Mod</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial}
#menu{position:fixed;top:10px;left:10px;background:#222;padding:12px;border-radius:12px;width:180px;z-index:10}
button{width:100%;margin:4px 0;padding:8px;background:#00ff88;border:0;border-radius:6px;font-weight:bold}
#game{width:100vw;height:100vh;background:#2a2a2a;position:relative;overflow:hidden}
.bot{width:50px;height:50px;background:red;border-radius:50%;position:absolute;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="menu">
<h3>MOD MENU</h3>
<button onclick="spawn()">+ Бот</button>
<button onclick="clearB()">Очистить</button>
<p>Ботов: <span id="c">0</span></p>
</div>
<div id="game"></div>
<script>
let count=0;
function spawn(){
let b=document.createElement('div');b.className='bot';b.innerText='BOT';
b.style.left=Math.random()*70+'%';b.style.top=Math.random()*70+'%';
b.onclick=()=>{b.remove();count--;document.getElementById('c').innerText=count}
document.getElementById('game').appendChild(b);count++;
document.getElementById('c').innerText=count;
}
function clearB(){document.querySelectorAll('.bot').forEach(b=>b.remove());count=0;document.getElementById('c').innerText=0}
</script>
</body>
</html>
